name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore src/ItNewsIntelligenceHub.slnx

      - name: Build .NET solution
        run: dotnet build src/ItNewsIntelligenceHub.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test src/ItNewsIntelligenceHub.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/itnewsintelligencehub.client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: src/itnewsintelligencehub.client/package-lock.json
          
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
